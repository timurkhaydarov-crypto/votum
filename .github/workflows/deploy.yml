name: Deploy VOTUM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: votum-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: votum_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: votum_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d votum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, gd, intl, mbstring, pgsql, pdo_pgsql, sqlite3, zip
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run tests
        run: php artisan test

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.VOTUM_DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY" || {
            echo "The VOTUM_DEPLOY_KEY repository secret is required." >&2
            exit 1
          }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          cat deploy/known_hosts >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload release
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            votum-deploy@194.87.103.1 \
            "install -d -m 2755 /var/www/votum/releases/$GITHUB_SHA"
          rsync -az --delete \
            --exclude='/.env' \
            --exclude='/storage' \
            --exclude='/public/storage' \
            --exclude='/database/database.sqlite' \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/node_modules' \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./ \
            "votum-deploy@194.87.103.1:/var/www/votum/releases/$GITHUB_SHA/"

      - name: Activate release
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            votum-deploy@194.87.103.1 \
            "sudo -n /usr/local/sbin/deploy-votum $GITHUB_SHA"
